name: Stage npm prerelease

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Verify and stage
    environment: npm-stage
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.18.0
      - run: npm run release:check
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run sbom
      - name: Upload reviewed SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ember-wallet-sdk-sbom-${{ github.ref_name }}
          path: artifacts/ember-wallet-sdk.cdx.json
          if-no-files-found: error
      - name: Stage package for maintainer review
        run: npm stage publish --tag beta --access public
